app-id: re.fossplant.vmlinux-to-elf
sdk: org.gnome.Sdk
runtime: org.gnome.Platform
runtime-version: "51"
command: vmlinux-to-elf-gui

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - python3-modules.yaml

  - name: vmlinux-to-elf
    buildsystem: simple
    build-commands:
      - install -Dm644 ./vmlinux_to_elf/ui/assets/re.fossplant.vmlinux-to-elf.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 ./vmlinux_to_elf/ui/assets/re.fossplant.vmlinux-to-elf.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 ./vmlinux_to_elf/ui/assets/re.fossplant.vmlinux-to-elf.desktop -t /app/share/applications/
      - rm -rf ./vmlinux_to_elf/ *.g* packaging pics *.lock *.md *.yaml *.toml LICENSE
    sources:
      - type: git
        url: https://github.com/marin-m/vmlinux-to-elf
        tag: 1.4.0.1
        commit: 29eac31a38db48b51c0dc6aae3be0162237601eb
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
